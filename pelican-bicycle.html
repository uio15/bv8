<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body { height: 100%; margin: 0; }
  body {
    display: flex; align-items: center; justify-content: center;
    background: radial-gradient(circle at 50% 12%, #f4fbff, #cfe9f7 55%, #a6cfe8);
    font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
    color: #14313f;
  }
  .stage { width: min(96vw, 1040px); padding: 16px; }
  .frame {
    background: #fff; border-radius: 20px; padding: 14px;
    box-shadow: 0 20px 45px rgba(14, 58, 82, .28), inset 0 1px 0 #fff;
  }
  svg { display: block; width: 100%; height: auto; border-radius: 14px; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    margin: 12px 4px 2px; font-size: 14px; color: #4b6b7c;
  }
  button {
    font: inherit; padding: 6px 16px; border-radius: 999px; cursor: pointer;
    border: 1px solid #bcd6e4; background: #f2f9fd; color: #215266;
  }
  button:hover { background: #e4f2fa; }
</style>
</head>
<body>
<div class="stage">
  <div class="frame">
    <svg id="scene" viewBox="0 0 800 450" role="img" aria-label="鹈鹕骑自行车的二维动画">
      <defs>
        <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#b9e5ff"/><stop offset="1" stop-color="#ecf9ff"/>
        </linearGradient>
        <linearGradient id="road" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#6e7d8a"/><stop offset="1" stop-color="#3b4750"/>
        </linearGradient>
        <linearGradient id="bodyG" x1="0.2" y1="0" x2="0.6" y2="1">
          <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#d9e8f1"/>
        </linearGradient>
        <linearGradient id="billG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffc154"/><stop offset="1" stop-color="#ef8f1c"/>
        </linearGradient>
        <linearGradient id="pouchG" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffe09a"/><stop offset="1" stop-color="#f0a637"/>
        </linearGradient>
        <radialGradient id="sunG">
          <stop offset="0" stop-color="#fff8cc"/><stop offset="1" stop-color="#ffd35c"/>
        </radialGradient>
      </defs>

      <!-- 天空 / 太阳 / 云 -->
      <rect width="800" height="450" fill="url(#sky)"/>
      <circle cx="688" cy="84" r="42" fill="url(#sunG)"/>
      <g id="cloudA" fill="#ffffff">
        <ellipse cx="150" cy="72" rx="58" ry="25"/>
        <ellipse cx="196" cy="82" rx="38" ry="19"/>
        <ellipse cx="104" cy="84" rx="33" ry="17"/>
      </g>
      <g id="cloudB" fill="#ffffff" opacity=".95">
        <ellipse cx="620" cy="132" rx="50" ry="21"/>
        <ellipse cx="662" cy="140" rx="33" ry="17"/>
      </g>
      <g id="cloudC" fill="#ffffff" opacity=".8">
        <ellipse cx="380" cy="46" rx="34" ry="15"/>
        <ellipse cx="412" cy="52" rx="24" ry="12"/>
      </g>

      <!-- 远山 -->
      <path d="M-30 380 Q 120 286 270 380 Z" fill="#a9d9b4"/>
      <path d="M226 380 Q 420 262 646 380 Z" fill="#8ec99b"/>
      <path d="M560 380 Q 706 296 840 380 Z" fill="#a9d9b4"/>

      <!-- 路面 -->
      <rect x="0" y="380" width="800" height="70" fill="url(#road)"/>
      <rect x="0" y="378" width="800" height="4" fill="#9db0bd" opacity=".85"/>
      <g id="dashes" stroke="#e8f0f6" stroke-width="4" opacity=".55"></g>

      <!-- 扬尘 -->
      <g fill="#cfd8de">
        <circle id="p1" cx="256" cy="372" r="4" opacity=".4"/>
        <circle id="p2" cx="256" cy="372" r="4" opacity=".4"/>
        <circle id="p3" cx="256" cy="372" r="4" opacity=".4"/>
      </g>

      <!-- 速度线 -->
      <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity=".5">
        <line id="sp1" x1="640" y1="196" x2="716" y2="196"/>
        <line id="sp2" x1="664" y1="228" x2="742" y2="228"/>
        <line id="sp3" x1="628" y1="262" x2="700" y2="262"/>
      </g>

      <!-- 地面阴影 -->
      <ellipse cx="400" cy="382" rx="182" ry="9" fill="#2c3a44" opacity=".22"/>
      <!-- ===================== 自行车 ===================== -->
      <g id="bike">
        <!-- 后轮 -->
        <g transform="translate(280 330)">
          <circle r="50" fill="none" stroke="#23313d" stroke-width="8"/>
          <circle r="43" fill="none" stroke="#93a7b6" stroke-width="1.6"/>
          <g id="spinRear" stroke="#c9d8e2" stroke-width="1.6">
            <line x1="-42" y1="0" x2="42" y2="0"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(36)"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(72)"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(108)"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(144)"/>
            <circle r="5" fill="#23313d" stroke="none"/>
          </g>
        </g>

        <!-- 前轮 -->
        <g transform="translate(520 330)">
          <circle r="50" fill="none" stroke="#23313d" stroke-width="8"/>
          <circle r="43" fill="none" stroke="#93a7b6" stroke-width="1.6"/>
          <g id="spinFront" stroke="#c9d8e2" stroke-width="1.6">
            <line x1="-42" y1="0" x2="42" y2="0"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(36)"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(72)"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(108)"/>
            <line x1="-42" y1="0" x2="42" y2="0" transform="rotate(144)"/>
            <circle r="5" fill="#23313d" stroke="none"/>
          </g>
        </g>

        <!-- 远侧腿（在车架之后） -->
        <path id="legFar" fill="none" stroke="#c9801f" stroke-width="10"
              stroke-linecap="round" stroke-linejoin="round" d=""/>
        <ellipse id="footFar" cx="380" cy="366" rx="13" ry="5" fill="#c9801f"/>

        <!-- 链条 -->
        <g fill="none" stroke="#66757f" stroke-width="2" stroke-dasharray="5 4">
          <path d="M380 325 L284 320"/>
          <path d="M380 355 L284 340"/>
        </g>

        <!-- 车架 -->
        <g fill="none" stroke="#e2554b" stroke-width="8" stroke-linecap="round">
          <path d="M280 330 L380 340"/>
          <path d="M280 330 L326 240"/>
          <path d="M380 340 L326 240"/>
          <path d="M380 340 L492 246"/>
          <path d="M326 244 L489 236"/>
          <path d="M489 232 L496 250" stroke-width="11"/>
          <path d="M496 250 L520 330"/>
          <path d="M489 236 L497 210" stroke-width="7"/>
          <path d="M470 204 C 484 196 506 196 524 204" stroke-width="7"/>
        </g>
        <circle cx="470" cy="204" r="6" fill="#23313d"/>
        <circle cx="524" cy="204" r="6" fill="#23313d"/>

        <!-- 车座 -->
        <path d="M296 234 C 304 218 342 216 352 230 C 342 242 308 244 296 234 Z" fill="#23313d"/>

        <!-- 曲柄 / 牙盘 / 脚踏 -->
        <g id="crank" transform="translate(380 340) rotate(0)"
           stroke="#4c5a66" stroke-width="6" stroke-linecap="round">
          <circle r="15" fill="none" stroke="#7f8e9a" stroke-width="3"/>
          <line x1="0" y1="0" x2="0" y2="-26"/>
          <line x1="0" y1="0" x2="0" y2="26"/>
          <rect x="-12" y="-32" width="24" height="7" rx="3" fill="#23313d" stroke="none"/>
          <rect x="-12" y="25" width="24" height="7" rx="3" fill="#23313d" stroke="none"/>
          <circle r="5" fill="#4c5a66" stroke="none"/>
        </g>

        <!-- 近侧腿（在车架之前） -->
        <path id="legNear" fill="none" stroke="#f8ae2c" stroke-width="11"
              stroke-linecap="round" stroke-linejoin="round" d=""/>
        <ellipse id="footNear" cx="380" cy="366" rx="14" ry="5.5" fill="#f8ae2c"/>
      </g>
      <!-- ===================== 鹈鹕 ===================== -->
      <g id="bird">
        <!-- 尾羽 -->
        <path d="M266 168 C 240 154 228 174 234 196 C 248 202 264 190 270 178 Z" fill="#e8f1f8"/>
        <!-- 身体 -->
        <ellipse cx="330" cy="172" rx="74" ry="50" fill="url(#bodyG)"/>
        <ellipse cx="334" cy="198" rx="52" ry="22" fill="#cfe0ec" opacity=".55"/>
        <!-- 翅膀 -->
        <g id="wing">
          <path d="M340 148 C 292 142 254 168 258 198 C 264 226 306 236 332 214 C 348 200 352 166 340 148 Z"
                fill="#f4fafd"/>
          <path d="M334 162 C 310 170 292 188 288 208" fill="none" stroke="#d6e5ef" stroke-width="2"/>
          <path d="M336 180 C 316 188 304 198 300 214" fill="none" stroke="#d6e5ef" stroke-width="2"/>
        </g>
        <!-- 脖子 -->
        <path d="M360 150 C 372 116 396 100 424 102" fill="none" stroke="#f2f9fd"
              stroke-width="36" stroke-linecap="round"/>
        <path d="M366 152 C 378 122 398 106 422 108" fill="none" stroke="#dceaf4"
              stroke-width="9" stroke-linecap="round" opacity=".8"/>
        <!-- 头 -->
        <circle cx="432" cy="104" r="30" fill="#f2f9fd"/>
        <path d="M414 78 C 404 60 386 54 374 58 C 388 68 398 80 404 92 Z" fill="#eaf4fa"/>
        <!-- 喙（上颌） -->
        <path d="M448 92 Q 512 96 566 116 L 558 126 Q 506 112 448 108 Z" fill="url(#billG)"/>
        <path d="M452 100 C 494 102 528 108 558 118" fill="none" stroke="#e08f24"
              stroke-width="1.6" opacity=".75"/>
        <!-- 喉囊 -->
        <path d="M450 108 C 456 152 482 178 518 158 C 542 145 552 134 558 126 C 506 112 450 108 450 108 Z"
              fill="url(#pouchG)" opacity=".97"/>
        <path d="M468 132 C 484 152 504 158 522 152" fill="none" stroke="#e0962a"
              stroke-width="2" opacity=".65"/>
        <!-- 眼睛 -->
        <circle cx="440" cy="94" r="6" fill="#14313f"/>
        <circle cx="442" cy="92" r="2" fill="#ffffff"/>
        <!-- 围巾 -->
        <g id="scarf">
          <path d="M420 128 C 400 124 374 122 350 128" fill="none" stroke="#e2554b"
                stroke-width="13" stroke-linecap="round"/>
          <path id="scarfTail" d="M350 128 C 332 134 320 142 314 154" fill="none"
                stroke="#e2554b" stroke-width="11" stroke-linecap="round"/>
        </g>
      </g>
    </svg>
    <div class="bar">
      <span>鹈鹕骑自行车 · 纯 SVG + 原生 JS 驱动，无外部依赖</span>
      <button id="toggle" type="button">暂停</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var scene = document.getElementById('scene');
  var crank = document.getElementById('crank');
  var spinRear = document.getElementById('spinRear');
  var spinFront = document.getElementById('spinFront');
  var legNear = document.getElementById('legNear');
  var legFar = document.getElementById('legFar');
  var footNear = document.getElementById('footNear');
  var footFar = document.getElementById('footFar');
  var bird = document.getElementById('bird');
  var wing = document.getElementById('wing');
  var scarfTail = document.getElementById('scarfTail');
  var dashes = document.getElementById('dashes');
  var puffs = [document.getElementById('p1'), document.getElementById('p2'), document.getElementById('p3')];
  var clouds = [document.getElementById('cloudA'), document.getElementById('cloudB'), document.getElementById('cloudC')];
  var speedLines = scene.querySelectorAll('line[id^="sp"]');
  var toggle = document.getElementById('toggle');

  /* ---------- 骨架参数（SVG 用户坐标） ---------- */
  var BB = { x: 380, y: 340 };   // 中轴 / 牙盘中心
  var CRANK_R = 26;              // 曲柄长度
  var HIP = { x: 350, y: 224 };  // 髋关节（藏在肚子下）
  var THIGH = 76;                // 大腿
  var SHIN = 76;                 // 小腿
  var RPM = 15;                  // 踏频
  var CRANK_DEG_PER_S = RPM * 6; // 每秒曲柄角度
  var GEAR = 2.4;                // 轮子相对曲柄的转速比
  var ROAD_SPEED = 170;          // 路面纹样滚动速度 px/s
  var CLOUD_W = 340;             // 云飘动的循环宽度

  function toRad(deg) { return deg * Math.PI / 180; }
  function round(v) { return Math.round(v * 10) / 10; }

  /* 曲柄角度 deg 时，脚踏（脚掌）所在位置 */
  function pedalPoint(deg) {
    var a = toRad(deg);
    return { x: BB.x + CRANK_R * Math.sin(a), y: BB.y - CRANK_R * Math.cos(a) };
  }

  /* 两骨骼 IK：已知髋与脚，求膝盖（取膝盖朝前的那组解） */
  function kneePoint(hip, foot, l1, l2) {
    var dx = foot.x - hip.x;
    var dy = foot.y - hip.y;
    var d = Math.max(0.001, Math.sqrt(dx * dx + dy * dy));
    var along = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    var h = Math.sqrt(Math.max(0, l1 * l1 - along * along));
    var bx = hip.x + (along / d) * dx;
    var by = hip.y + (along / d) * dy;
    var px = -dy / d;
    var py = dx / d;
    var k1 = { x: bx + h * px, y: by + h * py };
    var k2 = { x: bx - h * px, y: by - h * py };
    return (k1.x > k2.x) ? k1 : k2;
  }

  function legPath(foot, bob) {
    var hip = { x: HIP.x, y: HIP.y + bob };
    var knee = kneePoint(hip, foot, THIGH, SHIN);
    return 'M' + round(hip.x) + ' ' + round(hip.y) +
           ' L' + round(knee.x) + ' ' + round(knee.y) +
           ' L' + round(foot.x) + ' ' + round(foot.y);
  }

  function scarfPath(t) {
    var w1 = Math.sin(t * 6.5) * 7;
    var w2 = Math.sin(t * 6.5 + 1.1) * 9;
    var w3 = Math.cos(t * 6.5) * 6;
    return 'M350 128 C ' + round(332) + ' ' + round(134 + w1) +
           ' ' + round(314) + ' ' + round(142 + w2) +
           ' ' + round(308) + ' ' + round(156 + w3);
  }

  /* 路面虚线只建一次 */
  (function buildDashes() {
    var ns = 'http://www.w3.org/2000/svg';
    for (var x = -72; x < 880; x += 72) {
      var ln = document.createElementNS(ns, 'line');
      ln.setAttribute('x1', x);
      ln.setAttribute('y1', 412);
      ln.setAttribute('x2', x + 36);
      ln.setAttribute('y2', 412);
      dashes.appendChild(ln);
    }
  })();

  /* ---------- 逐帧绘制 ---------- */
  function render(t) {
    var crankDeg = t * CRANK_DEG_PER_S;          // 连续角度，避免取模造成跳变
    var wheelDeg = crankDeg * GEAR;

    crank.setAttribute('transform', 'translate(380 340) rotate(' + round(crankDeg) + ')');
    spinRear.setAttribute('transform', 'rotate(' + round(wheelDeg) + ')');
    spinFront.setAttribute('transform', 'rotate(' + round(wheelDeg) + ')');

    var pedalNear = pedalPoint(crankDeg);
    var pedalFar = pedalPoint(crankDeg + 180);
    var bob = Math.sin(toRad(crankDeg * 2)) * 1.8;   // 每圈起伏两次

    legNear.setAttribute('d', legPath(pedalNear, bob));
    legFar.setAttribute('d', legPath(pedalFar, bob));
    footNear.setAttribute('cx', round(pedalNear.x));
    footNear.setAttribute('cy', round(pedalNear.y + 4));
    footFar.setAttribute('cx', round(pedalFar.x));
    footFar.setAttribute('cy', round(pedalFar.y + 4));

    bird.setAttribute('transform', 'translate(0 ' + round(bob) + ')');
    wing.setAttribute('transform', 'rotate(' + round(Math.sin(toRad(crankDeg * 2 + 40)) * 4) + ' 340 152)');
    scarfTail.setAttribute('d', scarfPath(t));

    var i;
    for (i = 0; i < clouds.length; i++) {
      var sp = [16, 26, 21][i];
      var x = ((i * 260 + t * sp) % (800 + CLOUD_W)) - CLOUD_W;
      clouds[i].setAttribute('transform', 'translate(' + round(x) + ' 0)');
    }

    for (i = 0; i < puffs.length; i++) {
      var p = ((t / 1.15) + i / 3) % 1;             // 0→1 循环的扬尘
      puffs[i].setAttribute('cx', round(258 - 64 * p));
      puffs[i].setAttribute('cy', round(372 + 12 * p));
      puffs[i].setAttribute('r', round(4 + 11 * p));
      puffs[i].setAttribute('opacity', round(Math.max(0, 0.5 * (1 - p)) * 1000) / 1000);
    }

    dashes.setAttribute('transform', 'translate(' + round(-((t * ROAD_SPEED) % 72)) + ' 0)');
    for (i = 0; i < speedLines.length; i++) {
      speedLines[i].setAttribute('opacity', round(0.25 + 0.4 * (0.5 + 0.5 * Math.sin(t * 4 - i * 0.9)) * 100) / 100);
    }
  }

  /* ---------- 主循环（可暂停） ---------- */
  var t = 0;
  var last = null;
  var paused = false;

  function frame(now) {
    if (last === null) { last = now; }
    var dt = (now - last) / 1000;
    last = now;
    if (!paused) { t += Math.min(dt, 0.05); }
    render(t);
    requestAnimationFrame(frame);
  }

  toggle.addEventListener('click', function () {
    paused = !paused;
    toggle.textContent = paused ? '继续' : '暂停';
  });

  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
